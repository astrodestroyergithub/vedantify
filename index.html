<!DOCTYPE html>
<html lang="en" data-sect="advaita">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vedantify — The One-Stop Vedic Wisdom, Metacognition & Sanatana Dharma Platform</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body id="app-root-body" class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-white">

  <!-- Top Sticky Navigation & Command Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-white/85 dark:bg-stone-950/85 border-b border-amber-500/25 px-3 sm:px-6 py-2.5">
    <div class="max-w-[1600px] mx-auto flex items-center justify-between gap-2 sm:gap-4">
      <!-- Brand + Mobile Drawer Button -->
      <div class="flex items-center gap-2.5">
        <button type="button" onclick="toggleLeftSidebar()" class="lg:hidden p-2 rounded-xl v-btn-outline text-sm" aria-label="Toggle Navigation">
          ☰
        </button>
        <button type="button" onclick="navigateModule('home')" class="flex items-center gap-2.5 text-left group">
          <div class="w-9 h-9 rounded-xl v-btn-primary flex items-center justify-center text-lg shadow-md">
            🕉️
          </div>
          <div>
            <div class="font-bold text-base sm:text-lg font-serif-vedic tracking-wide leading-none">VEDANTIFY</div>
            <div class="text-[10px] opacity-70 hidden sm:block">Vedic Wisdom • Metacognition • Sanatana Dharma</div>
          </div>
        </button>
      </div>

      <!-- Global Omnisearch Bar -->
      <div class="relative flex-1 max-w-md mx-1 sm:mx-4">
        <div class="relative flex items-center">
          <span class="absolute left-3 text-xs opacity-60">🔍</span>
          <input
            id="global-search-input"
            type="search"
            oninput="handleGlobalSearch(this.value)"
            onfocus="handleGlobalSearch(this.value)"
            placeholder="Search Shlokas, Vivekananda, Stories, Kumbh, Seva, Diwali..."
            class="w-full pl-8 pr-3 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm border border-amber-500/35 bg-amber-50/40 dark:bg-stone-900/60 focus:outline-none focus:border-amber-500"
          />
        </div>
        <div id="global-search-dropdown" class="hidden absolute left-0 right-0 mt-1.5 v-card shadow-2xl max-h-96 overflow-y-auto z-50"></div>
      </div>

      <!-- Right Controls: Sect Theme Switcher, HA Pill, XP, Dark Mode, Audio, Auth, Sidepanel -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="api-status-pill" type="button" onclick="navigateModule('admin')" class="hidden xl:inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-700 border border-emerald-500/30">
          🟢 Multi-API HA: Online
        </button>

        <select
          id="sect-theme-select"
          onchange="setSectTheme(this.value)"
          aria-label="Select Sect Theme"
          class="px-2.5 py-1.5 rounded-xl text-xs font-semibold v-btn-outline cursor-pointer"
        >
          <option value="advaita">☀️ Advaita (Saffron)</option>
          <option value="shaiva">🔱 Shaivism (Indigo)</option>
          <option value="vaishnava">🦚 Vaishnavism (Teal)</option>
          <option value="shakta">🌺 Shaktism (Crimson)</option>
          <option value="buddhism">🪷 Buddhism (Ochre)</option>
        </select>

        <button id="header-xp-badge" type="button" onclick="toggleRightSidepanel()" class="hidden md:inline-flex px-3 py-1.5 rounded-xl text-xs font-bold v-badge">
          ✨ 240 Punya XP
        </button>

        <button id="audio-mute-btn" type="button" onclick="toggleAudioMute()" class="hidden sm:inline-flex px-2.5 py-1.5 rounded-xl text-xs font-semibold v-btn-outline">
          🔔 Audio
        </button>

        <button id="dark-mode-btn" type="button" onclick="toggleDarkMode()" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold v-btn-outline">
          🌙 Night
        </button>

        <button id="header-user-btn" type="button" onclick="openAuthModal()" class="px-3 py-1.5 rounded-xl text-xs font-semibold v-btn-primary">
          👤 Aarav
        </button>

        <button type="button" onclick="toggleRightSidepanel()" class="p-1.5 sm:px-2.5 sm:py-1.5 rounded-xl text-xs font-semibold v-btn-outline" title="Toggle Sankalpa & API Telemetry Drawer">
          ⚡
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace Layout: Left Sidebar + Center Viewport + Right Sidepanel -->
  <div class="flex-1 max-w-[1600px] w-full mx-auto flex relative">

    <!-- Mobile Backdrop -->
    <div id="mobile-sidebar-backdrop" onclick="toggleLeftSidebar()" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

    <!-- Left Navigation Sidebar -->
    <aside
      id="left-sidebar"
      class="fixed lg:static inset-y-0 left-0 z-40 w-64 shrink-0 v-card rounded-none lg:rounded-2xl lg:my-4 lg:ml-4 p-4 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0 overflow-y-auto"
    >
      <div class="space-y-1">
        <div class="px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider opacity-60">Sanatana Modules</div>
        <button type="button" data-nav-module="home" onclick="navigateModule('home')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold v-btn-primary shadow-sm text-left">
          <span>🏛️</span><span>Home & Sankalpa</span>
        </button>
        <button type="button" data-nav-module="epics" onclick="navigateModule('epics')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>📜</span><span>Epics & 3D Shlokas</span>
        </button>
        <button type="button" data-nav-module="stories" onclick="navigateModule('stories')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>🪔</span><span>Vedic Stories</span>
        </button>
        <button type="button" data-nav-module="usecases" onclick="navigateModule('usecases')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>⚖️</span><span>Real-World Use Cases</span>
        </button>
        <button type="button" data-nav-module="preachers" onclick="navigateModule('preachers')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>🧘‍♂️</span><span>Famous Preachers</span>
        </button>
        <button type="button" data-nav-module="kids" onclick="navigateModule('kids')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>🦚</span><span>Child’s Corner</span>
        </button>
        <button type="button" data-nav-module="spirituality" onclick="navigateModule('spirituality')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>🪷</span><span>Spirituality & Mind</span>
        </button>
        <button type="button" data-nav-module="quizzes" onclick="navigateModule('quizzes')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>🏹</span><span>Quizzes & Wisdom Test</span>
        </button>
        <button type="button" data-nav-module="blogs" onclick="navigateModule('blogs')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>✍️</span><span>Vedic Blogs</span>
        </button>
        <button type="button" data-nav-module="news" onclick="navigateModule('news')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>📰</span><span>Sanatana News</span>
        </button>
        <button type="button" data-nav-module="seva" onclick="navigateModule('seva')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>🤝</span><span>Community Seva</span>
        </button>
        <button type="button" data-nav-module="calendar" onclick="navigateModule('calendar')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>📅</span><span>Festival Calendar</span>
        </button>
        <button type="button" data-nav-module="admin" onclick="navigateModule('admin')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium hover:bg-amber-500/10 transition text-left">
          <span>⚙️</span><span>Admin & Multi-API HA</span>
        </button>
      </div>

      <div class="mt-6 p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/25 text-xs space-y-2">
        <div class="font-bold">🔐 Account & Role</div>
        <p class="opacity-80">Sign up, switch seeker roles, or manage saved shlokas.</p>
        <button type="button" onclick="openAuthModal()" class="w-full v-btn-outline py-1.5 text-xs font-semibold">Sign Up / Switch Role</button>
      </div>
    </aside>

    <!-- Main Dynamic Module Viewport -->
    <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8" onclick="closeSearchDropdown()">
      <div id="main-module-container"></div>
    </main>

    <!-- Right Contextual Sidepanel (Sankalpa Tracker, Bookmarks & Multi-API HA Telemetry) -->
    <aside
      id="right-sidepanel"
      class="hidden 2xl:block w-80 shrink-0 v-card my-4 mr-4 p-4 space-y-6 self-start sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto"
    >
      <div>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-xs font-bold uppercase tracking-wider">☀️ Daily Sankalpa Checklist</h3>
          <button type="button" onclick="toggleRightSidepanel()" class="2xl:hidden text-xs opacity-70">✕</button>
        </div>
        <div id="sidepanel-tasks-list" class="space-y-2"></div>
      </div>

      <div>
        <h3 class="text-xs font-bold uppercase tracking-wider mb-2">🔖 Saved Shloka Bookmarks</h3>
        <div id="sidepanel-bookmarks-list" class="space-y-1"></div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-xs font-bold uppercase tracking-wider">📡 Multi-API Fault-Tolerance</h3>
          <button type="button" onclick="triggerGlobalAPISync()" class="text-[11px] text-amber-600 font-semibold hover:underline">Sync Now</button>
        </div>
        <div class="flex gap-1.5 mb-2">
          <button type="button" onclick="toggleSimulatePrimaryOutage()" class="w-full py-1.5 px-2 rounded-lg text-[11px] font-semibold v-btn-outline">
            ⚡ Toggle Tier-1 Outage Simulation
          </button>
        </div>
        <div id="sidepanel-api-logs" class="space-y-1"></div>
      </div>
    </aside>
  </div>

  <!-- Footer -->
  <footer class="border-t border-amber-500/20 py-6 px-4 sm:px-8 text-xs opacity-75 mt-12">
    <div class="max-w-[1600px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div><strong>Vedantify</strong> • The One-Stop Global Platform for Vedic Wisdom, Metacognition & Sanatana Dharma</div>
      <div class="flex flex-wrap gap-4">
        <button type="button" onclick="navigateModule('epics')" class="hover:underline">3D Scriptures</button>
        <button type="button" onclick="navigateModule('kids')" class="hover:underline">Bal Sanskar</button>
        <button type="button" onclick="navigateModule('seva')" class="hover:underline">Vishwa Seva</button>
        <button type="button" onclick="navigateModule('calendar')" class="hover:underline">Festival Planner</button>
        <button type="button" onclick="navigateModule('admin')" class="hover:underline">Multi-API Status</button>
      </div>
    </div>
  </footer>

  <!-- Universal Modal Dialog -->
  <div id="universal-modal-backdrop" onclick="if(event.target===this)closeUniversalModal()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 items-center justify-center p-4">
    <div class="v-card max-w-2xl w-full max-h-[88vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 sm:p-5 border-b border-stone-200/60 flex items-center justify-between gap-3">
        <h3 id="universal-modal-title" class="text-base sm:text-lg font-bold font-serif-vedic">Modal Title</h3>
        <button type="button" onclick="closeUniversalModal()" class="px-2.5 py-1 rounded-lg v-btn-outline text-xs font-bold">✕ Close</button>
      </div>
      <div id="universal-modal-body" class="p-5 sm:p-6 overflow-y-auto"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm"></div>

  <script>
window.VEDANTIFY_HERO_IMG = "assets/hero-ashram.jpg";
window.VEDANTIFY_EPICS_IMG = "assets/epics-manuscript.jpg";
window.VEDANTIFY_KIDS_IMG = "assets/kids-banyan.jpg";
</script>
<script src="js/data.js"></script>
<script src="js/api-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
